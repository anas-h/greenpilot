version: '3.8'

services:
  # PHP-FPM application server
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      network: host
    container_name: greenpilot-app
    restart: unless-stopped
    working_dir: /var/www
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
    environment:
      - PHP_MEMORY_LIMIT=256M
      - PHP_MAX_EXECUTION_TIME=60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - greenpilot-network

  # Nginx web server
  nginx:
    image: nginx:1.25-alpine
    container_name: greenpilot-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - greenpilot-network

  # PostgreSQL database
  postgres:
    image: postgres:16
    container_name: greenpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecogarage
      POSTGRES_USER: ecogarage
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecogarage -d ecogarage"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - greenpilot-network

  # Redis cache / queue / session store
  redis:
    image: redis:alpine
    container_name: greenpilot-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - greenpilot-network

  # Vite dev server for frontend
  node:
    image: node:20-alpine
    container_name: greenpilot-node
    restart: unless-stopped
    working_dir: /var/www/frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www
      - node-modules:/var/www/frontend/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      - app
    networks:
      - greenpilot-network

  # Queue worker
  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
      network: host
    container_name: greenpilot-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - greenpilot-network

  # Task scheduler
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
      network: host
    container_name: greenpilot-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - .:/var/www
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - greenpilot-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  node-modules:
    driver: local

networks:
  greenpilot-network:
    driver: bridge
