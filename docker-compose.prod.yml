services:
  # Traefik reverse proxy + SSL
  traefik:
    image: traefik:v3.0
    container_name: greenpilot-traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik.yml:/etc/traefik/traefik.yml:ro
      - letsencrypt-data:/letsencrypt
    networks:
      - greenpilot-network

  # PHP-FPM application server
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: greenpilot-app
    restart: always
    working_dir: /var/www
    environment:
      - PHP_MEMORY_LIMIT=256M
      - PHP_MAX_EXECUTION_TIME=60
    volumes:
      - app-storage:/var/www/storage
      - app-public:/var/www/public
      - app-frontend:/var/www/frontend/dist
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - greenpilot-network
    deploy:
      resources:
        limits:
          memory: 512M

  # Nginx web server
  nginx:
    image: nginx:1.25-alpine
    container_name: greenpilot-nginx
    restart: always
    volumes:
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public:/var/www/public:ro
      - app-frontend:/var/www/frontend/dist:ro
    depends_on:
      - app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.greenpilot.rule=Host(`greenpilot.fr`) || Host(`app.greenpilot.fr`)"
      - "traefik.http.routers.greenpilot.entrypoints=websecure"
      - "traefik.http.routers.greenpilot.tls.certresolver=letsencrypt"
      - "traefik.http.services.greenpilot.loadbalancer.server.port=80"
    networks:
      - greenpilot-network
    deploy:
      resources:
        limits:
          memory: 128M

  # PostgreSQL database
  postgres:
    image: postgres:16
    container_name: greenpilot-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ecogarage}
      POSTGRES_USER: ${DB_USERNAME:-ecogarage}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ecogarage} -d ${DB_DATABASE:-ecogarage}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - greenpilot-network
    deploy:
      resources:
        limits:
          memory: 512M

  # Redis cache / queue / session store
  redis:
    image: redis:alpine
    container_name: greenpilot-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - greenpilot-network
    deploy:
      resources:
        limits:
          memory: 256M

  # Queue worker
  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: greenpilot-queue
    restart: always
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - greenpilot-network
    deploy:
      resources:
        limits:
          memory: 256M

  # Task scheduler
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: greenpilot-scheduler
    restart: always
    working_dir: /var/www
    command: php artisan schedule:work
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - greenpilot-network
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  letsencrypt-data:
    driver: local
  app-storage:
    driver: local
  app-public:
    driver: local
  app-frontend:
    driver: local

networks:
  greenpilot-network:
    driver: bridge
