name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /opt/greenpilot

            # Pull latest code
            git pull origin main

            # Rebuild and restart containers
            docker compose -f docker-compose.prod.yml build --no-cache app
            docker compose -f docker-compose.prod.yml up -d

            # Run migrations
            docker exec greenpilot-app php artisan migrate --force

            # Clear caches
            docker exec greenpilot-app php artisan config:cache
            docker exec greenpilot-app php artisan route:cache
            docker exec greenpilot-app php artisan view:cache

            # Restart queue worker to pick up new code
            docker exec greenpilot-app php artisan queue:restart

            echo "Deploy complete!"
